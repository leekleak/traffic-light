name: Android CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;30.0.16248370"
          accept-android-sdk-licenses: true

      - name: Build project
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Run unit tests
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          ./gradlew --no-daemon test --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
            name: unit-test-reports
            path: |
              **/build/reports/tests/
              **/build/test-results/
            if-no-files-found: ignore

      - name: Upload APK Debug
        uses: actions/upload-artifact@v7
        with:
            name: trafficlight-debug
            path: app/build/outputs/apk/**/debug/*.apk
